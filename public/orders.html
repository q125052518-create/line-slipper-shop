<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>訂單查詢</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="orders-page">
    <header class="app-header">
      <div>
        <p class="eyebrow">Orders</p>
        <h1>訂單查詢</h1>
      </div>
      <nav class="header-actions">
        <a class="cart-link" href="/">繼續購物</a>
        <a class="cart-link" href="/cart.html">購物車</a>
      </nav>
    </header>

    <main class="orders-layout">
      <section class="checkout order-lookup-panel">
        <form id="orderLookupForm" class="order-form">
          <h2>查詢資料</h2>
          <label>
            訂單編號
            <input name="orderId" autocomplete="off" maxlength="100" required>
          </label>
          <label>
            結帳手機
            <input name="phone" inputmode="tel" autocomplete="tel" maxlength="30" required>
          </label>
          <button type="submit">查詢訂單</button>
          <p id="lookupMessage" class="message"></p>
        </form>
      </section>

      <section class="catalog-panel">
        <div class="section-head">
          <div>
            <h2>訂單紀錄</h2>
            <p id="orderSummary" class="muted">輸入訂單編號與結帳手機查詢。</p>
          </div>
          <button id="refreshOrdersButton" class="hidden" type="button">重新整理</button>
        </div>
        <div id="orders" class="orders"></div>
      </section>
    </main>

    <script src="/orders.js"></script>
  </body>
</html>
