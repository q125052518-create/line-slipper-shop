<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>曜鑰購物</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/storefront.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body class="storefront-page">
    <div class="storefront-topline">
      <span>把喜歡收藏好，把心意包裝好。</span>
      <a href="https://shopee.tw/bluej26252912" target="_blank" rel="noopener noreferrer">蝦皮賣場 <img src="/assets/icons/arrow-up-right.svg" alt="" width="14" height="14"></a>
    </div>
    <header class="app-header">
      <div class="storefront-brand">
        <a href="/" class="storefront-home"><img id="headerAvatar" src="/assets/store/brand-avatar.jpg" alt="" width="52" height="52"><h1>曜鑰購物</h1></a>
      </div>
      <label class="storefront-search" for="productSearch">
        <img src="/assets/icons/search.svg" alt="" width="20" height="20">
        <span class="storefront-sr-only">搜尋商品名稱</span>
        <input id="productSearch" type="search" placeholder="搜尋喜歡的商品" autocomplete="off">
      </label>
      <nav class="header-actions" aria-label="購物服務">
        <a class="cart-link" href="/orders.html"><img src="/assets/icons/package.svg" alt="" width="20" height="20"><span>我的訂單</span></a>
        <a class="cart-link" href="/cart.html"><img src="/assets/icons/shopping-bag.svg" alt="" width="20" height="20"><span>購物車</span><span id="cartCount">0</span></a>
        <a class="cart-link hidden" data-buyer-chat href="/chat.html">聊聊</a>
        <button class="hidden" data-buyer-logout type="button">登出</button>
      </nav>
    </header>

    <main class="shop-layout shopee-style-layout">
      <section class="storefront-cover">
        <div class="store-profile-card">
          <img id="storeAvatar" src="/assets/store/brand-avatar.jpg" alt="曜鑰購物">
          <div class="store-profile-copy">
            <p class="store-status">COLLECT &amp; CHERISH</p>
            <h2 id="storeName">曜鑰購物</h2>
            <p id="marketDescription">商品載入中</p>
            <div class="store-profile-actions">
              <a href="/chat.html" data-buyer-chat class="store-outline-button hidden">聊聊</a>
            </div>
          </div>
        </div>
        <div class="store-meta-grid">
          <span><strong id="storeProductCount">0</strong> 件商品</span>
          <span><strong id="storeCategoryCount">0</strong> 個分類</span>
          <span><strong>免登入</strong> 輕鬆購物</span>
          <span><strong>7-11</strong> 門市取貨</span>
        </div>
      </section>

      <nav id="storeTabs" class="store-tabs" aria-label="賣場導覽">
        <button type="button" data-store-tab="store">賣場首頁</button>
        <button type="button" data-store-tab="products">全部商品</button>
        <button type="button" data-store-tab="categories">商品分類</button>
      </nav>

      <section id="layoutBlocks" class="store-layout-blocks" aria-label="賣場布置"></section>
      <section id="categoryDirectory" class="store-category-directory hidden" aria-label="全部分類"></section>

      <section id="productShell" class="storefront-shell">
        <aside class="store-sidebar">
          <h2>商品分類</h2>
          <div id="categoryLanding" class="shop-category-list" aria-label="商品分類"></div>
        </aside>

        <section class="store-product-area">
          <div id="categoryView">
            <div class="shop-toolbar">
              <div>
                <p class="eyebrow">THE COLLECTION</p>
                <h2 id="categoryTitle">全部商品</h2>
              </div>
              <label class="shop-sort">
                <span>排序</span>
                <select id="productSort">
                  <option value="default">綜合排序</option>
                  <option value="price-asc">價格低到高</option>
                  <option value="price-desc">價格高到低</option>
                </select>
              </label>
            </div>
            <div>
              <div id="subCategoryLanding" class="sub-category-strip" aria-label="子分類"></div>
              <div id="products" class="product-grid shop-product-grid"></div>
            </div>
          </div>

          <p id="message" class="message"></p>
        </section>
      </section>
    </main>

    <footer class="storefront-footer">
      <span>曜鑰購物 <small>把喜歡，好好收藏。</small></span>
      <a href="/orders.html">訂單查詢</a>
      <a href="https://shopee.tw/bluej26252912" target="_blank" rel="noopener noreferrer">蝦皮賣場 <img src="/assets/icons/arrow-up-right.svg" alt="" width="14" height="14"></a>
    </footer>

    <script src="/header.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
