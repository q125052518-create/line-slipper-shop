<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>曜鑰購物</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/storefront.css">
    <link rel="preload" as="image" href="/assets/store/editorial-hero.png">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body class="storefront-page">
    <div class="storefront-topline">
      <span>收藏日常，也收藏喜歡。</span>
    </div>
    <header class="app-header">
      <div class="storefront-brand">
        <a href="/" class="storefront-home"><img id="storeAvatar" src="/assets/store/brand-avatar.jpg" alt="" width="48" height="48"><span class="storefront-wordmark"><strong class="header-store-name">曜鑰購物</strong><small>little things, lovely days.</small></span></a>
      </div>
      <label class="storefront-search" for="productSearch">
        <img src="/assets/icons/search.svg" alt="" width="20" height="20">
        <span class="storefront-sr-only">搜尋商品名稱</span>
        <input id="productSearch" type="search" placeholder="搜尋喜歡的商品" autocomplete="off">
      </label>
      <nav class="header-actions" aria-label="購物服務">
        <a class="cart-link" href="/orders.html"><img src="/assets/icons/package.svg" alt="" width="20" height="20"><span>我的訂單</span></a>
        <a class="cart-link" href="/cart.html"><img src="/assets/icons/shopping-bag.svg" alt="" width="20" height="20"><span>購物車</span><span id="cartCount">0</span></a>
        <a class="cart-link hidden" data-buyer-chat href="/chat.html">聊聊</a>
        <button class="hidden" data-buyer-logout type="button">登出</button>
      </nav>
    </header>

    <section id="storeHero" class="store-hero" aria-labelledby="storeName">
      <img class="store-hero-art" src="/assets/store/editorial-hero.png" alt="粉色卡冊、卡套與包裝紙的品牌情境圖" width="2172" height="724" fetchpriority="high">
      <div class="store-hero-inner">
        <div class="store-hero-copy">
          <p class="store-hero-kicker">A LITTLE JOY, EVERY DAY</p>
          <h1 id="storeName">曜鑰購物</h1>
          <p class="store-hero-line">把喜歡的小事，<br>好好收藏。</p>
          <p id="marketDescription" class="store-hero-description">卡膜卡套・出卡包材・活頁卡冊</p>
          <button type="button" class="store-hero-button" data-open-category="all">逛逛選物 <img src="/assets/icons/arrow-right.svg" alt="" width="18" height="18"></button>
        </div>
      </div>
    </section>

    <main class="shop-layout shopee-style-layout">
      <nav id="storeTabs" class="store-tabs" aria-label="賣場導覽">
        <button type="button" data-store-tab="store">選物首頁</button>
        <button type="button" data-store-tab="products">全部商品 <span id="storeProductCount">0</span></button>
        <button type="button" data-store-tab="categories">商品分類 <span id="storeCategoryCount">0</span></button>
        <span class="store-nav-note">FOR YOUR EVERYDAY COLLECTION</span>
      </nav>

      <section id="layoutBlocks" class="store-layout-blocks" aria-label="賣場布置"></section>
      <section id="categoryDirectory" class="store-category-directory hidden" aria-label="全部分類"></section>

      <section id="productShell" class="storefront-shell">
        <aside class="store-sidebar">
          <h2>商品分類</h2>
          <div id="categoryLanding" class="shop-category-list" aria-label="商品分類"></div>
        </aside>

        <section class="store-product-area">
          <div id="categoryView">
            <div class="shop-toolbar">
              <div>
                <p class="eyebrow">FIND YOUR LITTLE JOY</p>
                <h2 id="categoryTitle">全部商品</h2>
              </div>
              <label class="shop-sort">
                <span>排序</span>
                <select id="productSort">
                  <option value="default">綜合排序</option>
                  <option value="price-asc">價格低到高</option>
                  <option value="price-desc">價格高到低</option>
                </select>
              </label>
            </div>
            <div>
              <div id="subCategoryLanding" class="sub-category-strip" aria-label="子分類"></div>
              <div id="products" class="product-grid shop-product-grid"></div>
            </div>
          </div>

          <p id="message" class="message"></p>
        </section>
      </section>
    </main>

    <section class="store-closing-note" aria-label="品牌小語">
      <span>Keep what you love.</span>
      <p>每一份喜歡，都值得被好好對待。</p>
    </section>
    <footer class="storefront-footer">
      <span>曜鑰購物 <small>little things, lovely days.</small></span>
      <a href="/orders.html">訂單查詢</a>
    </footer>

    <script src="/header.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
